<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba de Rastreo de Envíos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .timeline-line::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 15px;
      width: 2px;
      background: #e5e7eb;
      z-index: 0;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col items-center justify-start p-4 md:p-8">

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="w-full max-w-3xl bg-white shadow-xl rounded-2xl border border-slate-100 overflow-hidden">
    
    <!-- HEADER -->
    <header class="bg-slate-900 text-white p-6 text-center">
      <h1 class="text-2xl md:text-3xl font-bold tracking-tight flex items-center justify-center gap-3">
        <i class="fa-solid fa-truck-fast text-indigo-400"></i>
        Rastreo de Envíos (Prueba)
      </h1>
      <p class="text-slate-400 text-sm mt-1">Prueba de conexión con Tokens `ira_` y `irs_`</p>
    </header>

    <!-- FORMULARIO DE BÚSQUEDA -->
    <section class="p-6 border-b border-slate-100 bg-slate-50/50">
      <form id="formRastreo" class="flex flex-col sm:flex-row gap-3">
        <div class="relative flex-1">
          <i class="fa-solid fa-barcode absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input 
            type="text" 
            id="inputGuia" 
            placeholder="Ingresa la guía de prueba (Ej: 700199137878)" 
            required
            class="w-full pl-11 pr-4 py-3 bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition font-mono uppercase text-slate-800 placeholder:text-slate-400"
          >
        </div>
        <button 
          type="submit" 
          id="btnBuscar"
          class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20 active:scale-95"
        >
          <i class="fa-solid fa-magnifying-glass"></i>
          <span>Probar Guía</span>
        </button>
      </form>
    </section>

    <!-- ÁREA DE CARGA -->
    <div id="loader" class="hidden p-12 text-center">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-slate-200 border-t-indigo-600"></div>
      <p class="text-slate-500 mt-3 text-sm font-medium">Validando tokens y consultando guía...</p>
    </div>

    <!-- MENSAJE DE ERROR O ALERTA -->
    <div id="msgError" class="hidden m-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm flex items-start gap-3">
      <i class="fa-solid fa-circle-exclamation text-lg mt-0.5 text-red-500"></i>
      <div id="textoError">Ocurrió un error en la autenticación o consulta.</div>
    </div>

    <!-- RESULTADOS DEL RASTREO -->
    <section id="resultado" class="hidden p-6 space-y-6">
      
      <!-- ESTADO GENERAL -->
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 p-5 rounded-xl bg-slate-50 border border-slate-200/80">
        <div>
          <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Número de Guía</div>
          <div id="resGuia" class="text-xl font-bold font-mono text-slate-900">--</div>
        </div>
        <div id="badgeEstado" class="inline-flex items-center gap-2 px-4 py-2 rounded-full text-sm font-bold bg-indigo-100 text-indigo-800">
          <i id="iconoEstado" class="fa-solid fa-clock"></i>
          <span id="textoEstado">--</span>
        </div>
      </div>

      <!-- DETALLES DE ORIGEN Y DESTINO -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="p-4 rounded-xl border border-slate-100 bg-white shadow-sm">
          <div class="text-xs text-slate-400 font-medium">Origen</div>
          <div id="resOrigen" class="text-base font-semibold text-slate-800 mt-1">--</div>
          <div id="resRemitente" class="text-xs text-slate-500 mt-1">--</div>
        </div>
        <div class="p-4 rounded-xl border border-slate-100 bg-white shadow-sm">
          <div class="text-xs text-slate-400 font-medium">Destino</div>
          <div id="resDestino" class="text-base font-semibold text-slate-800 mt-1">--</div>
          <div id="resDestinatario" class="text-xs text-slate-500 mt-1">--</div>
        </div>
      </div>

      <!-- METADATOS -->
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 text-xs text-slate-600 bg-slate-50 p-4 rounded-xl">
        <div>
          <span class="block text-slate-400 font-medium">Servicio:</span>
          <strong id="resServicio" class="text-slate-700">--</strong>
        </div>
        <div>
          <span class="block text-slate-400 font-medium">Fecha Envío:</span>
          <strong id="resFechaEnvio" class="text-slate-700">--</strong>
        </div>
        <div>
          <span class="block text-slate-400 font-medium">Est. Entrega:</span>
          <strong id="resFechaEstimada" class="text-slate-700">--</strong>
        </div>
      </div>

      <!-- HISTORIAL (TIMELINE) -->
      <div>
        <h3 class="text-base font-bold text-slate-900 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-list-check text-indigo-600"></i>
          Trazabilidad / Historial
        </h3>
        <div id="timeline" class="relative timeline-line space-y-6 pl-2"></div>
      </div>

    </section>

  </main>

  <!-- LÓGICA CON CREDENCIALES CONFIGURADAS -->
  <script>
    const API_CONFIG = {
      // Ajusta la URL según el host donde ejecutes tu servidor Node.js
      baseUrl: 'https://interlasamericas.kodevasoft.space/api/ext', 
      tokenAcceso: 'ira_5580ec17777e39dd3dc4c24554267f29fb60e03bcbd63338',
      tokenSeguridad: 'irs_e2badc04b4db12927c7d178157e71f2323119c64d40e750d'
    };

    const formRastreo = document.getElementById('formRastreo');
    const inputGuia = document.getElementById('inputGuia');
    const btnBuscar = document.getElementById('btnBuscar');
    const loader = document.getElementById('loader');
    const msgError = document.getElementById('msgError');
    const textoError = document.getElementById('textoError');
    const resultado = document.getElementById('resultado');

    formRastreo.addEventListener('submit', async (e) => {
      e.preventDefault();
      const guia = inputGuia.value.trim().toUpperCase();
      if (!guia) return;

      ocultarElemento(msgError);
      ocultarElemento(resultado);
      mostrarElemento(loader);
      btnBuscar.disabled = true;

      try {
        const response = await fetch(`${API_CONFIG.baseUrl}/rastrear/${encodeURIComponent(guia)}`, {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${API_CONFIG.tokenAcceso}`,
            'X-API-Secret': API_CONFIG.tokenSeguridad
          }
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.mensaje || data.error || `Error HTTP ${response.status}`);
        }

        renderizarResultado(data);

      } catch (error) {
        textoError.textContent = `[Error de prueba]: ${error.message}`;
        mostrarElemento(msgError);
      } finally {
        ocultarElemento(loader);
        btnBuscar.disabled = false;
      }
    });

    function renderizarResultado(data) {
      document.getElementById('resGuia').textContent = data.guia || '--';
      document.getElementById('textoEstado').textContent = data.estado?.texto || 'DESCONOCIDO';
      
      document.getElementById('resOrigen').textContent = data.envio?.origen || 'N/A';
      document.getElementById('resRemitente').textContent = data.remitente?.nombre ? `Remitente: ${data.remitente.nombre}` : '';

      document.getElementById('resDestino').textContent = data.envio?.destino || 'N/A';
      document.getElementById('resDestinatario').textContent = data.destinatario?.nombre ? `Destinatario: ${data.destinatario.nombre}` : '';

      document.getElementById('resServicio').textContent = data.envio?.servicio || 'Estándar';
      document.getElementById('resFechaEnvio').textContent = data.envio?.fecha_envio || '--';
      document.getElementById('resFechaEstimada').textContent = data.envio?.fecha_estimada_entrega || '--';

      const containerTimeline = document.getElementById('timeline');
      containerTimeline.innerHTML = '';

      const historial = data.historial || [];
      if (historial.length === 0) {
        containerTimeline.innerHTML = '<p class="text-sm text-slate-400 italic">Sin eventos registrados.</p>';
      } else {
        historial.forEach((item, index) => {
          const esUltimo = index === historial.length - 1;
          const htmlItem = `
            <div class="relative flex items-start gap-4 z-10">
              <div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0 ${esUltimo ? 'bg-indigo-600 text-white ring-4 ring-indigo-100' : 'bg-slate-200 text-slate-600'}">
                <i class="fa-solid ${esUltimo ? 'fa-location-dot' : 'fa-check'} text-xs"></i>
              </div>
              <div class="flex-1 bg-white p-3 rounded-lg border border-slate-100 shadow-sm">
                <div class="flex items-center justify-between gap-2">
                  <span class="font-bold text-sm text-slate-800">${item.descripcion_estado || 'Evento'}</span>
                  <span class="text-xs text-slate-400 font-mono">${item.fecha_cambio || ''}</span>
                </div>
                ${item.ciudad ? `<div class="text-xs font-semibold text-indigo-600 mt-0.5"><i class="fa-solid fa-city mr-1"></i>${item.ciudad}</div>` : ''}
                ${item.observacion ? `<p class="text-xs text-slate-500 mt-1">${item.observacion}</p>` : ''}
              </div>
            </div>
          `;
          containerTimeline.insertAdjacentHTML('beforeend', htmlItem);
        });
      }

      mostrarElemento(resultado);
    }

    function mostrarElemento(el) { el.classList.remove('hidden'); }
    function ocultarElemento(el) { el.classList.add('hidden'); }
  </script>
</body>
</html>
